<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>JM Car Helper 授权回调</title>
</head>
<body>
  <p id="status">正在安全完成授权…</p>
  <script>
  (() => {
    const originalSearch = location.search;
    const params = new URLSearchParams(originalSearch);
    // Remove the code from this history entry before navigating. Never display it.
    history.replaceState(null, '', location.pathname);
    if (params.getAll('state').length !== 1 || !params.get('state') ||
        (params.getAll('code').length !== 1 && !params.has('error'))) {
      document.getElementById('status').textContent = '授权参数不完整，请从 car.yydriver.cn 重新开始。';
      return;
    }
    // Fixed destination; preserve the original query encoding and all parameters.
    location.replace('https://car.yydriver.cn/auth/finish' + originalSearch);
  })();
  </script>
  <noscript>请启用 JavaScript 后，从 car.yydriver.cn 重新开始授权。</noscript>
</body>
</html>
