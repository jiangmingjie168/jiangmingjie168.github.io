<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f3c98a">
<meta name="format-detection" content="telephone=no">
<title>Daily English Adventure — Yangyang's English Adventure</title>
<style>
  :root {
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --ink: #2b2118;
    --muted: #7a6556;
    --paper: #fff8ef;
    --paper-edge: #f3e4d0;
    --accent: #e07a3d;
    --accent-deep: #c45c28;
    --ok: #2c9b6a;
    --ok-soft: #e6f6ee;
    --bad: #d15b48;
    --bad-soft: #fdecea;
    --star: #f0b429;
    --streak: #e56b2e;
    --line: #e8d5be;
    --shadow: 0 12px 32px rgba(80, 48, 20, .14);
    --radius: 24px;
    --font: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: #f3c98a;
    min-height: 100dvh;
    overflow: hidden;
    user-select: none;
  }
  button { font-family: inherit; }

  .sky {
    position: fixed; inset: 0;
    background:
      radial-gradient(1200px 600px at 20% -10%, #ffe7b3 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 10%, #f7b36a 0%, transparent 50%),
      linear-gradient(180deg, #f7d7a1 0%, #f0c07a 42%, #e8d5b0 100%);
    z-index: 0;
    transition: background 700ms ease;
  }
  body.theme-play .sky { opacity: 1; }
  body.theme-door .sky { background: linear-gradient(180deg, #9fd4f5 0%, #c8e7fb 38%, #efe3c0 100%); }
  body.theme-walk .sky { background: linear-gradient(180deg, #8ecdf0 0%, #c6ebc2 48%, #d9efb0 100%); }
  body.theme-sky .sky { background: linear-gradient(180deg, #6eb6ea 0%, #b9dcfa 40%, #f0d56a 100%); }
  body.theme-pets .sky { background: linear-gradient(180deg, #f0d2a8 0%, #f6e6cc 50%, #e8d0aa 100%); }
  body.theme-farm .sky { background: linear-gradient(180deg, #b7d36a 0%, #dce89a 40%, #efe3a8 100%); }
  body.theme-water .sky { background: linear-gradient(180deg, #7ec9de 0%, #b9e4ea 42%, #f0e0b4 100%); }
  body.theme-yard .sky { background: linear-gradient(180deg, #c5dca8 0%, #e4edd0 50%, #efe6d2 100%); }
  body.theme-garden .sky { background: linear-gradient(180deg, #c8d85a 0%, #e8d56a 55%, #c4a056 100%); }
  body.theme-make .sky { background: linear-gradient(180deg, #e8d2ae 0%, #f3e6d0 50%, #d4b48a 100%); }
  body.theme-moon .sky { background: linear-gradient(180deg, #12162f 0%, #2a2f5c 48%, #3a2f58 100%); }
  body.theme-bed .sky { background: linear-gradient(180deg, #1a1436 0%, #3a2a58 55%, #2a2048 100%); }
  body.theme-finale .sky { background: linear-gradient(180deg, #ffd76a 0%, #ffb45a 45%, #ffe9b4 100%); }
  body.theme-morning .sky { background: linear-gradient(180deg, #ffd9a0 0%, #f7c07a 40%, #f6e1c0 100%); }

  .wrap { position: relative; z-index: 1; height: 100dvh; display: flex; flex-direction: column; }

  /* ===== MAP ===== */
  #view-map {
    flex: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    padding: calc(var(--safe-t) + 18px) calc(20px + var(--safe-r)) calc(28px + var(--safe-b)) calc(20px + var(--safe-l));
  }
  .brand { text-align: center; margin: 6px 0 18px; }
  .brand-en {
    font-size: 1.55rem; font-weight: 800; letter-spacing: -0.03em;
    line-height: 1.15; color: #2b2118;
    text-shadow: 0 1px 0 rgba(255,255,255,.45);
  }
  .brand-zh { margin-top: 4px; font-size: 1.05rem; color: #6a4e38; font-weight: 600; }
  .brand-tip { margin-top: 8px; font-size: .82rem; color: #8a6e5a; line-height: 1.45; }
  .hero {
    height: 132px; margin: 0 auto 18px; max-width: 420px;
    filter: drop-shadow(0 10px 16px rgba(90,50,20,.12));
  }
  .hero svg { width: 100%; height: 100%; display: block; }

  .start-btn, .sheet-btn, .listen-btn, .choice, .icon-btn {
    border: 0; cursor: pointer; appearance: none;
  }
  .start-btn {
    display: block; width: 100%; max-width: 420px; margin: 0 auto 22px;
    background: linear-gradient(180deg, #f08a42, #de6a28);
    color: #fff; font-size: 1.15rem; font-weight: 700;
    padding: 16px 20px; border-radius: 999px;
    box-shadow: 0 8px 0 #b84e16, 0 14px 24px rgba(180,70,20,.25);
    min-height: 56px;
  }
  .start-btn:active { transform: translateY(2px); box-shadow: 0 6px 0 #b84e16, 0 8px 16px rgba(180,70,20,.2); }

  .journey { max-width: 420px; margin: 0 auto; }
  .chapter {
    margin: 0 0 8px 4px;
    font-size: .75rem; font-weight: 700; letter-spacing: .14em;
    color: #8a6748; text-transform: none;
  }
  .chapter:not(:first-child) { margin-top: 18px; }
  .path { position: relative; padding-left: 8px; }
  .path::before {
    content: ""; position: absolute; left: 35px; top: 18px; bottom: 18px;
    width: 3px; border-radius: 3px;
    background: linear-gradient(180deg, #e8c48a, #d4b07a);
  }
  .node {
    position: relative; display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: var(--paper);
    border: 1px solid rgba(255,255,255,.7);
    border-radius: 18px;
    padding: 10px 14px 10px 10px;
    margin: 0 0 10px;
    box-shadow: 0 6px 16px rgba(90,50,20,.08);
    color: inherit;
    min-height: 72px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .node:active { transform: scale(.985); }
  .node.done { box-shadow: 0 6px 16px rgba(44,155,106,.12); }
  .node.done .node-badge { outline: 2px solid #3cb37a; }
  .node-icon {
    width: 52px; height: 52px; flex: 0 0 52px;
    border-radius: 16px; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .node-icon svg { width: 100%; height: 100%; display: block; }
  .node-text { flex: 1; min-width: 0; }
  .node-name { font-size: 1.05rem; font-weight: 750; line-height: 1.2; }
  .node-en { font-size: .75rem; color: var(--muted); margin-top: 2px; }
  .node-badge {
    width: 28px; height: 28px; border-radius: 50%;
    background: #f3e6d4; color: #a18468;
    display: grid; place-items: center;
    font-size: .7rem; font-weight: 800;
    flex: 0 0 28px;
  }
  .node.done .node-badge { background: #fff4c8; color: #c48a10; }
  .node-badge .tick { color: #2c9b6a; font-size: .9rem; }

  /* ===== PLAY ===== */
  #view-play {
    display: none;
    flex: 1; flex-direction: column;
    min-height: 0;
    padding-top: var(--safe-t);
  }
  .play-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 6px calc(12px + var(--safe-l));
    padding-right: calc(12px + var(--safe-r));
  }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 14px;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(8px);
    color: var(--ink); font-size: 1.1rem; font-weight: 700;
    box-shadow: 0 2px 8px rgba(40,20,10,.08);
    display: grid; place-items: center;
    flex: 0 0 42px;
  }
  .play-title { flex: 1; min-width: 0; text-align: center; }
  .play-title .cn { font-weight: 800; font-size: 1rem; line-height: 1.2; }
  .play-title .en { font-size: .7rem; color: var(--muted); margin-top: 1px; }
  body.theme-moon .play-title .cn,
  body.theme-bed .play-title .cn { color: #f6efe4; }
  body.theme-moon .play-title .en,
  body.theme-bed .play-title .en { color: #c8bdd8; }
  body.theme-moon .icon-btn,
  body.theme-bed .icon-btn { background: rgba(255,255,255,.16); color: #f6efe4; }
  .stats {
    display: flex; gap: 6px; align-items: center;
    font-weight: 800; font-size: .82rem;
  }
  .pill {
    background: rgba(255,255,255,.78);
    padding: 5px 8px; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(40,20,10,.08);
    white-space: nowrap;
  }
  body.theme-moon .pill, body.theme-bed .pill { background: rgba(255,255,255,.16); color: #f6efe4; }
  .pill .s { color: #d9480f; }
  .dots {
    display: flex; justify-content: center; gap: 5px;
    padding: 0 16px 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,.18); }
  .dot.on { background: #fff; box-shadow: 0 0 0 3px rgba(224,122,61,.35); }
  .dot.done { background: #2c9b6a; }
  body.theme-moon .dot, body.theme-bed .dot { background: rgba(255,255,255,.28); }
  body.theme-moon .dot.on, body.theme-bed .dot.on { background: #f0d78c; }

  .stage {
    height: min(210px, 32vh);
    padding: 0 8px;
    display: flex; align-items: flex-end; justify-content: center;
    position: relative;
    z-index: 0;
    overflow: hidden;
    flex: 0 0 auto;
  }
  .stage-art {
    width: 100%; max-width: 460px; height: 100%;
    filter: drop-shadow(0 8px 14px rgba(20,20,40,.12));
  }
  .stage-art svg { width: 100%; height: 100%; display: block; overflow: hidden; }

  .sheet {
    flex: 1; min-height: 0;
    position: relative;
    z-index: 2;
    background: var(--paper);
    border-radius: 28px 28px 0 0;
    box-shadow: 0 -12px 40px rgba(40,20,10,.12);
    padding: 18px 18px calc(16px + var(--safe-b));
    padding-left: calc(18px + var(--safe-l));
    padding-right: calc(18px + var(--safe-r));
    display: flex; flex-direction: column;
    overflow: auto;
  }
  .prompt { text-align: center; color: var(--muted); font-size: .88rem; margin: 0 0 10px; }
  .listen-row { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 8px; }
  .listen-btn {
    width: 86px; height: 86px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffb070, #e07a3d 58%, #c45c28);
    color: #fff;
    box-shadow: 0 8px 0 #b84e16, 0 14px 24px rgba(180,70,20,.28);
    display: grid; place-items: center;
    position: relative;
  }
  .listen-btn svg { width: 38px; height: 38px; display: block; }
  .listen-btn:active { transform: translateY(2px); box-shadow: 0 6px 0 #b84e16, 0 8px 16px rgba(180,70,20,.2); }
  .listen-btn.speaking::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 3px solid rgba(224,122,61,.45);
    animation: pulse 1.1s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(.85); opacity: .9; }
    100% { transform: scale(1.2); opacity: 0; }
  }
  .listen-label { font-size: .78rem; font-weight: 700; color: var(--accent-deep); }
  .phrase {
    min-height: 2.2em; text-align: center;
    font-size: 1.15rem; font-weight: 800;
    color: var(--ink); letter-spacing: -0.02em;
    margin: 2px 0 10px; line-height: 1.3;
    transition: opacity .35s ease;
  }
  .phrase.hidden-phrase { color: #cbb7a3; font-weight: 600; letter-spacing: .2em; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    width: 100%; min-height: 58px;
    background: #fff; color: var(--ink);
    border-radius: 18px;
    padding: 14px 16px;
    font-size: 1.15rem; font-weight: 700;
    box-shadow: 0 2px 0 #ead9c4, 0 8px 16px rgba(90,50,20,.06);
    border: 2px solid #f0e4d4;
    text-align: center; line-height: 1.35;
  }
  .choice:active { transform: scale(.985); }
  .choice.correct { background: var(--ok-soft); border-color: #2c9b6a; color: #1e704c; }
  .choice.wrong { background: var(--bad-soft); border-color: #d15b48; color: #9a3b2e; animation: shake .4s ease; }
  .choice:disabled { opacity: 1; }
  .choice.wrong:disabled { opacity: .55; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .feedback {
    min-height: 1.6em; text-align: center;
    font-weight: 750; font-size: .98rem;
    margin-top: 10px;
  }
  .feedback.ok { color: #1e704c; }
  .feedback.bad { color: #9a3b2e; }

  /* ===== OVERLAYS ===== */
  .overlay {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(40, 24, 12, .38);
    backdrop-filter: blur(6px);
    padding: calc(24px + var(--safe-t)) 22px calc(24px + var(--safe-b));
    align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    width: 100%; max-width: 360px;
    background: var(--paper);
    border-radius: 28px;
    padding: 26px 22px 22px;
    text-align: center;
    box-shadow: var(--shadow);
    animation: pop .4s ease;
  }
  @keyframes pop {
    from { transform: scale(.92) translateY(12px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .modal h2 { margin: 8px 0 6px; font-size: 1.45rem; }
  .modal p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; font-size: .95rem; }
  .modal .big-star { font-size: 3rem; line-height: 1; }
  .sheet-btn {
    width: 100%; min-height: 52px; border-radius: 999px;
    font-size: 1.05rem; font-weight: 750; margin-top: 8px;
    background: linear-gradient(180deg, #f08a42, #de6a28);
    color: #fff;
    box-shadow: 0 6px 0 #b84e16;
  }
  .sheet-btn.ghost {
    background: #fff; color: var(--ink);
    box-shadow: 0 2px 0 #ead9c4;
    border: 2px solid #f0e4d4;
  }
  .sheet-btn:active { transform: translateY(1px); }

  @media (max-height: 700px) {
    .stage { height: min(168px, 28vh); }
    .hero { height: 108px; }
    .listen-btn { width: 72px; height: 72px; font-size: 1.7rem; }
    .choice { min-height: 52px; padding: 11px 14px; font-size: 1.08rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="wrap">
  <section id="view-map">
    <header class="brand">
      <div class="brand-en">Daily English Adventure</div>
      <div class="brand-zh">杨杨的英语冒险</div>
      <div class="brand-tip">听一句英语，选出对的中文意思<br>顺着一天的路程，一站一站走下去</div>
    </header>
    <div class="hero" id="hero-art"></div>
    <button class="start-btn" id="btn-start" type="button">开始今天的冒险</button>
    <div class="journey" id="journey"></div>
  </section>

  <section id="view-play">
    <div class="play-bar">
      <button class="icon-btn" id="btn-back" type="button" aria-label="回到地图">←</button>
      <div class="play-title">
        <div class="cn" id="play-cn"></div>
        <div class="en" id="play-en"></div>
      </div>
      <div class="stats">
        <div class="pill" id="stat-stars" title="星星">⭐ 0</div>
        <div class="pill" id="stat-streak" title="连击">🔥 0</div>
      </div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="stage"><div class="stage-art" id="stage-art"></div></div>
    <div class="sheet">
      <div class="prompt">听一听，选出正确的意思</div>
      <div class="listen-row">
        <button class="listen-btn" id="btn-listen" type="button" aria-label="听一听"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M7 17h9l13-9v32L16 31H7z"/><path fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" d="M33 17.5c3.4 3.2 3.4 9.8 0 13"/><path fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" d="M38.5 12.5c6.2 6 6.2 17 0 23"/></svg></button>
        <div class="listen-label">听一听</div>
      </div>
      <div class="phrase hidden-phrase" id="phrase">•••</div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>
</div>

<div class="overlay" id="overlay-clear">
  <div class="modal">
    <div class="big-star">🌟</div>
    <h2 id="clear-title">这一站完成了</h2>
    <p id="clear-msg"></p>
    <button class="sheet-btn" id="btn-next" type="button">下一站</button>
    <button class="sheet-btn ghost" id="btn-to-map" type="button">回到地图</button>
  </div>
</div>
<div class="overlay" id="overlay-done">
  <div class="modal">
    <div class="big-star">🎉</div>
    <h2>今天的冒险完成了</h2>
    <p id="done-msg"></p>
    <button class="sheet-btn" id="btn-again" type="button">再玩一天</button>
    <button class="sheet-btn ghost" id="btn-done-map" type="button">回到地图</button>
  </div>
</div>

<script>

const cssAnim = `
<style>
  .s-sway { transform-origin: 50% 100%; animation: sway 3.6s ease-in-out infinite; }
  .s-sway2 { transform-origin: 50% 100%; animation: sway 4.4s ease-in-out .4s infinite; }

  .s-drift2 { animation: drift 18s ease-in-out .8s infinite alternate; }
  .s-bob { animation: bob 2.4s ease-in-out infinite; }
  .s-bob2 { animation: bob 3s ease-in-out .5s infinite; }
  .s-pulse { animation: glow 2.2s ease-in-out infinite; }
  .s-twinkle { animation: twinkle 1.8s ease-in-out infinite; }
  .s-twinkle2 { animation: twinkle 2.4s ease-in-out .6s infinite; }
  .s-fall { animation: fall 1.5s linear infinite; }
  .s-fall2 { animation: fall 1.9s linear .4s infinite; }
  .s-fall3 { animation: fall 1.7s linear .9s infinite; }
  .s-rays { transform-origin: 50% 50%; animation: spin 28s linear infinite; }
  .s-hop { animation: hop 1.6s ease-in-out infinite; }
  .s-flicker { animation: flicker 1.1s ease-in-out infinite; }
  .s-swim { animation: swim 5s ease-in-out infinite; }
  .s-steam { animation: steam 2.8s ease-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
  @keyframes drift { from { transform: translateX(-12px); } to { transform: translateX(16px); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes glow { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes fall { 0% { transform: translateY(-8px); opacity: .2; } 20% { opacity: .8; } 100% { transform: translateY(86px); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-10px); } }
  @keyframes flicker { 0%,100% { opacity: .85; } 40% { opacity: 1; } 70% { opacity: .7; } }

  @keyframes steam { 0% { transform: translateY(0); opacity: .5; } 100% { transform: translateY(-16px); opacity: 0; } }
</style>`;

function svg(inner, vb="0 0 360 200") {
  return `${cssAnim}<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
}

const state = {
  view: "map",
  sceneIndex: 0,
  queue: [],
  qIndex: 0,
  stars: 0,
  streak: 0,
  bestStreak: 0,
  answeredInRun: 0,
  completed: {},
  sceneStarCount: {},
  locked: false,
  wrongPicked: [],
  voice: null,
  shot: false
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sceneById(id) { return SCENES.find(s => s.id === id); }

function pickVoice() {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  if (!voices.length) return null;
  const en = voices.filter(v => /^en(-|_)/i.test(v.lang));
  const nameRe = /samantha|victoria|karen|moira|tessa|fiona|veena|kate|serena|zira|susan|linda|salli|ivy|joanna|kendra|kimberly|salli|amy|emma|allison|ava|alison|female|woman/i;
  const maleRe = /male|david|daniel|tom|fred|arthur|aaron|brian|guy|ravi|aaron|nathan|john|alex\b/i;
  const named = en.find(v => nameRe.test(v.name) && !maleRe.test(v.name));
  if (named) return named;
  const sam = voices.find(v => /samantha/i.test(v.name));
  if (sam) return sam;
  const femaleEn = en.find(v => nameRe.test(v.name));
  if (femaleEn) return femaleEn;
  const notMale = en.find(v => !maleRe.test(v.name));
  return notMale || en[0] || null;
}

function refreshVoice() { state.voice = pickVoice(); }
if (window.speechSynthesis) {
  refreshVoice();
  speechSynthesis.addEventListener("voiceschanged", refreshVoice);
}

function speak(text) {
  if (state.shot || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.8;
  u.pitch = 1.05;
  if (state.voice) u.voice = state.voice;
  const btn = document.getElementById("btn-listen");
  btn.classList.add("speaking");
  u.onend = u.onerror = () => btn.classList.remove("speaking");
  speechSynthesis.speak(u);
}

function stopSpeak() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  const btn = document.getElementById("btn-listen");
  if (btn) btn.classList.remove("speaking");
}

function setTheme(theme) {
  document.body.className = theme ? ("theme-" + theme) : "";
  const colors = {
    morning: "#f3c98a", door: "#9fd4f5", walk: "#8ecdf0", sky: "#6eb6ea",
    pets: "#f0d2a8", farm: "#b7d36a", water: "#7ec9de", yard: "#c5dca8",
    garden: "#c8d85a", make: "#e8d2ae", moon: "#12162f", bed: "#1a1436",
    finale: "#ffd76a"
  };
  const c = colors[theme] || "#f3c98a";
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", c);
}

function allTranslations() {
  return SCENES.flatMap(s => s.items.map(i => i.translation));
}

function pickChoices(item, scene, count) {
  const pool = [];
  const seen = new Set([item.translation]);
  const add = (t) => { if (t && !seen.has(t)) { seen.add(t); pool.push(t); } };
  scene.items.forEach(i => add(i.translation));
  const idx = SCENES.indexOf(scene);
  [idx - 1, idx + 1, idx - 2, idx + 2].forEach(i => {
    if (SCENES[i]) SCENES[i].items.forEach(it => add(it.translation));
  });
  allTranslations().forEach(add);
  const distractors = shuffle(pool).slice(0, count - 1);
  return shuffle([item.translation, ...distractors]);
}

function renderMap() {
  const journey = document.getElementById("journey");
  journey.innerHTML = "";
  CHAPTERS.forEach(ch => {
    const h = document.createElement("div");
    h.className = "chapter";
    h.textContent = ch.title;
    journey.appendChild(h);
    const path = document.createElement("div");
    path.className = "path";
    ch.ids.forEach(id => {
      const scene = sceneById(id);
      const done = !!state.completed[id];
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "node" + (done ? " done" : "");
      const icon = ICONS[id];
      btn.innerHTML = `
        <div class="node-icon" style="background:${icon.bg}">
          <svg viewBox="0 0 40 40">${icon.d}</svg>
        </div>
        <div class="node-text">
          <div class="node-name">${scene.name}</div>
          <div class="node-en">${scene.nameEn}</div>
        </div>
        <div class="node-badge">${done ? "⭐" : scene.items.length}</div>`;
      btn.addEventListener("click", () => startScene(SCENES.indexOf(scene)));
      path.appendChild(btn);
    });
    journey.appendChild(path);
  });
  const firstOpen = SCENES.findIndex(s => !state.completed[s.id]);
  const start = document.getElementById("btn-start");
  start.textContent = firstOpen === -1 ? "再玩一天" : (state.stars ? "接着走" : "开始今天的冒险");
}

function showMap() {
  stopSpeak();
  state.view = "map";
  document.getElementById("view-map").style.display = "block";
  document.getElementById("view-play").style.display = "none";
  document.getElementById("overlay-clear").classList.remove("show");
  document.getElementById("overlay-done").classList.remove("show");
  setTheme("");
  document.getElementById("hero-art").innerHTML = ART.morning();
  renderMap();
  updateStats();
}

function startScene(index, opts) {
  const scene = SCENES[index];
  if (!scene) return;
  stopSpeak();
  state.view = "play";
  state.sceneIndex = index;
  state.queue = shuffle(scene.items);
  state.qIndex = 0;
  state.locked = false;
  state.wrongPicked = [];
  document.getElementById("view-map").style.display = "none";
  document.getElementById("view-play").style.display = "flex";
  document.getElementById("overlay-clear").classList.remove("show");
  document.getElementById("overlay-done").classList.remove("show");
  document.getElementById("play-cn").textContent = scene.name;
  document.getElementById("play-en").textContent = scene.nameEn;
  document.getElementById("stage-art").innerHTML = ART[scene.id]();
  setTheme(scene.theme);
  renderDots();
  renderQuestion(opts && opts.silent);
}

function renderDots() {
  const el = document.getElementById("dots");
  el.innerHTML = state.queue.map((_, i) => {
    const cls = i < state.qIndex ? "dot done" : (i === state.qIndex ? "dot on" : "dot");
    return `<span class="${cls}"></span>`;
  }).join("");
}

function useThreeChoices() {
  const cleared = Object.keys(state.completed).length;
  return cleared >= 3 || state.answeredInRun >= 8;
}

function currentItem() { return state.queue[state.qIndex]; }

function renderQuestion(silent) {
  const scene = SCENES[state.sceneIndex];
  const item = currentItem();
  state.locked = false;
  state.wrongPicked = [];
  renderDots();
  const phrase = document.getElementById("phrase");
  phrase.textContent = "•••";
  phrase.className = "phrase hidden-phrase";
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  const count = useThreeChoices() ? 3 : 2;
  const choices = pickChoices(item, scene, count);
  const box = document.getElementById("choices");
  box.innerHTML = "";
  choices.forEach(text => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.textContent = text;
    b.addEventListener("click", () => onChoose(text, b));
    box.appendChild(b);
  });
  if (!silent) {
    setTimeout(() => speak(item.phrase), 350);
  }
}

function onChoose(text, btn) {
  if (state.locked) return;
  const item = currentItem();
  if (text === item.translation) {
    state.locked = true;
    btn.classList.add("correct");
    document.querySelectorAll(".choice").forEach(b => b.disabled = true);
    const phrase = document.getElementById("phrase");
    phrase.textContent = item.phrase;
    phrase.className = "phrase";
    const fb = document.getElementById("feedback");
    fb.className = "feedback ok";
    const firstTry = state.wrongPicked.length === 0;
    if (firstTry) {
      state.stars += 1;
      state.streak += 1;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      fb.textContent = state.streak >= 3 ? "答对啦！连击 " + state.streak + " 🔥" : "答对啦！";
    } else {
      fb.textContent = "答对啦，再听一遍就记住了。";
    }
    state.answeredInRun += 1;
    updateStats();
    const wait = state.shot ? 0 : 1600;
    setTimeout(advanceAfterCorrect, wait);
  } else {
    if (state.wrongPicked.indexOf(text) !== -1) return;
    state.wrongPicked.push(text);
    state.streak = 0;
    btn.classList.add("wrong");
    btn.disabled = true;
    updateStats();
    const fb = document.getElementById("feedback");
    fb.className = "feedback bad";
    fb.textContent = "再听一次，再选一选。";
    speak(item.phrase);
  }
}

function advanceAfterCorrect() {
  if (state.qIndex < state.queue.length - 1) {
    state.qIndex += 1;
    renderQuestion();
  } else {
    finishScene();
  }
}

function finishScene() {
  const scene = SCENES[state.sceneIndex];
  state.completed[scene.id] = true;
  state.sceneStarCount[scene.id] = scene.items.length;
  const allDone = SCENES.every(s => state.completed[s.id]);
  if (allDone) {
    const msg = document.getElementById("done-msg");
    msg.textContent = "一共得到 " + state.stars + " 颗星星，最长连击 " + state.bestStreak + "。明天还可以再走一遍，题目顺序会换新的。";
    document.getElementById("overlay-done").classList.add("show");
  } else {
    document.getElementById("clear-title").textContent = scene.name + "，完成了";
    document.getElementById("clear-msg").textContent = "这一站的句子都听完了。可以去下一站，也可以回到地图选别的地方。";
    const nextBtn = document.getElementById("btn-next");
    const nextIdx = nextUncompleted(state.sceneIndex + 1);
    nextBtn.style.display = nextIdx === -1 ? "none" : "block";
    document.getElementById("overlay-clear").classList.add("show");
  }
}

function nextUncompleted(from) {
  for (let i = from; i < SCENES.length; i++) if (!state.completed[SCENES[i].id]) return i;
  for (let i = 0; i < from; i++) if (!state.completed[SCENES[i].id]) return i;
  return -1;
}

function updateStats() {
  document.getElementById("stat-stars").textContent = "⭐ " + state.stars;
  document.getElementById("stat-streak").textContent = "🔥 " + state.streak;
}

function resetRun() {
  state.stars = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.answeredInRun = 0;
  state.completed = {};
  state.sceneStarCount = {};
  updateStats();
}

document.getElementById("btn-start").addEventListener("click", () => {
  const allDone = SCENES.every(s => state.completed[s.id]);
  if (allDone) resetRun();
  const idx = nextUncompleted(0);
  startScene(idx === -1 ? 0 : idx);
});
document.getElementById("btn-back").addEventListener("click", showMap);
document.getElementById("btn-listen").addEventListener("click", () => {
  const item = currentItem();
  if (item) speak(item.phrase);
});
document.getElementById("btn-next").addEventListener("click", () => {
  const idx = nextUncompleted(state.sceneIndex + 1);
  if (idx !== -1) startScene(idx);
  else showMap();
});
document.getElementById("btn-to-map").addEventListener("click", showMap);
document.getElementById("btn-again").addEventListener("click", () => {
  resetRun();
  startScene(0);
});
document.getElementById("btn-done-map").addEventListener("click", () => {
  showMap();
});

(function boot() {
  const params = new URLSearchParams(location.search);
  const shot = params.get("shot");
  if (shot) state.shot = true;
  showMap();
  if (shot === "map" || !shot) return;
  const idx = SCENES.findIndex(s => s.id === shot);
  if (idx !== -1) {
    if (["farm", "water", "moon", "bed", "finale"].indexOf(shot) !== -1) {
      state.answeredInRun = 8;
    }
    startScene(idx, { silent: true });
  }
})();
</script>
