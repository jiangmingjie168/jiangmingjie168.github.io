<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>龟兔赛跑</title>
<style>
  :root {
    --paper: #f6efe3;
    --ink: #4a3c32;
    --ink-soft: #7a6a5c;
    --accent: #c37b6a;
    --sage: #6f8f74;
    --butter: #f1d392;
    --butter-deep: #e4c170;
    --card: #fffaf2;
    --shadow: 0 10px 28px rgba(90, 64, 40, 0.12);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  body {
    height: 100svh;
    overflow: hidden;
    padding: calc(10px + var(--safe-t)) 18px calc(10px + var(--safe-b));
  }
  .book {
    max-width: 430px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .top {
    text-align: center;
    padding: 4px 8px 10px;
  }
  .title {
    font-size: 15px;
    letter-spacing: 0.18em;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .pager {
    margin-top: 4px;
    font-size: 13px;
    color: #9a8b7c;
  }
  .stage {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .page { display: none; }
  .page.on { display: block; }
  .story {
    font-size: 22px;
    line-height: 1.95;
    letter-spacing: 0.04em;
    font-weight: 500;
    padding: 6px 4px 16px;
  }
  .story p { margin: 0 0 0.55em; }
  .story p:last-child { margin-bottom: 0; }
  .cue-wrap { white-space: nowrap; }
  .cue {
    display: inline-block;
    border: 0;
    margin: 0;
    padding: 0 0.42em;
    font: inherit;
    font-weight: 600;
    color: #6a4a1f;
    background: var(--butter);
    border-radius: 999px;
    line-height: 1.5;
    cursor: pointer;
    box-shadow: 0 0 0 3px rgba(241, 211, 146, 0.35);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .cue.done {
    animation: none;
    background: #ead7a8;
    box-shadow: none;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 3px rgba(241, 211, 146, 0.28); }
    50% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(241, 211, 146, 0.18); }
  }
  .ask {
    display: inline-block;
    margin: 2px 0 14px;
    padding: 8px 14px;
    border: 0;
    border-radius: 999px;
    background: #efe4d2;
    color: #5d4633;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .ask:active { transform: scale(0.98); }
  .frame {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 18px;
    overflow: hidden;
    background: transparent;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.8s ease, transform 0.8s ease;
    margin-bottom: 8px;
  }
  .frame.show {
    opacity: 1;
    transform: none;
    pointer-events: auto;
    box-shadow: var(--shadow);
    background: var(--card);
  }
  .frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .zzz {
    position: absolute;
    left: 38%;
    top: 28%;
    width: 42%;
    height: 40%;
    pointer-events: none;
    opacity: 0;
  }
  .frame.show .zzz { opacity: 1; }
  .z {
    position: absolute;
    bottom: 0;
    font-weight: 700;
    color: #8a6a3a;
    text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    opacity: 0;
    animation: floatz 3.4s ease-in-out infinite;
  }
  .z1 { left: 8%; font-size: 18px; animation-delay: 0s; }
  .z2 { left: 28%; font-size: 22px; animation-delay: 0.7s; }
  .z3 { left: 50%; font-size: 26px; animation-delay: 1.4s; }
  @keyframes floatz {
    0% { transform: translate(0, 8px); opacity: 0; }
    18% { opacity: 0.85; }
    70% { opacity: 0.55; }
    100% { transform: translate(10px, -78px); opacity: 0; }
  }
  .petals { position: absolute; inset: 0; pointer-events: none; }
  .petal {
    position: absolute;
    width: 14px;
    height: 20px;
    border-radius: 70% 70% 60% 60%;
    opacity: 0;
  }
  .frame.show .petal { animation: drift 6.8s ease-in-out infinite; }
  .p1 { left: 12%; top: 8%; background: #efb7aa; animation-delay: 0.2s; }
  .p2 { left: 28%; top: 2%; background: #f3d49a; width: 12px; height: 16px; animation-delay: 1.1s; }
  .p3 { left: 70%; top: 6%; background: #f4e6cf; animation-delay: 0.6s; }
  .p4 { left: 84%; top: 14%; background: #e8a898; width: 11px; height: 15px; animation-delay: 1.8s; }
  .p5 { left: 58%; top: 0%; background: #f0c6a0; animation-delay: 2.4s; }
  @keyframes drift {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    15% { opacity: 0.85; }
    100% { transform: translateY(46px) rotate(28deg); opacity: 0; }
  }
  .hit {
    position: absolute;
    left: 28%;
    top: 28%;
    width: 52%;
    height: 62%;
    border: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 50%;
  }
  .bubble {
    position: absolute;
    left: 8%;
    top: 6%;
    max-width: 72%;
    background: #fffdf8;
    color: var(--ink);
    border-radius: 18px;
    padding: 10px 14px;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: 0.04em;
    box-shadow: 0 8px 20px rgba(80, 56, 32, 0.14);
    opacity: 0;
    transform: translateY(6px) scale(0.96);
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .bubble:after {
    content: "";
    position: absolute;
    left: 42%;
    bottom: -8px;
    border: 8px solid transparent;
    border-top-color: #fffdf8;
    border-bottom: 0;
  }
  .bubble.on {
    opacity: 1;
    transform: none;
  }
  .nav {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    flex-shrink: 0;
    padding-top: 12px;
    background: linear-gradient(to top, var(--paper) 72%, rgba(246, 239, 227, 0.88));
  }
  .nav button {
    flex: 1;
    min-height: 48px;
    border: 0;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.08em;
    cursor: pointer;
    touch-action: manipulation;
  }
  #prev {
    background: #efe4d2;
    color: #6a5848;
  }
  #next {
    background: var(--sage);
    color: #fffaf2;
  }
  #prev[disabled], #next[disabled] {
    opacity: 0.35;
    cursor: default;
  }
  @media (max-width: 360px) {
    .story { font-size: 20px; }
    body { padding-left: 14px; padding-right: 14px; }
  }
  @media (max-height: 740px) {
    .story { font-size: 20px; line-height: 1.8; padding: 2px 4px 12px; }
    .ask { margin: 0 0 10px; padding: 7px 12px; font-size: 16px; }
    .top { padding-bottom: 6px; }
    .nav button { min-height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cue, .z, .petal, .frame, .bubble { animation: none !important; transition: none !important; }
    .frame { transform: none; }
    .frame.show { opacity: 1; }
    .bubble.on { opacity: 1; transform: none; }
  }
</style>
</head>

          <p>兔子跑得很快，一会儿就跑出好远。</p>
          <p>路旁有一棵大树，兔子靠着树，想先休息一下。</p>

(function () {
  var page = 1;
  var total = 3;

  var next = document.getElementById("next");

  var art2 = document.getElementById("art2");

  function clearTimers() {

    if (t2) { clearTimeout(t2); t2 = null; }
    if (t3) { clearTimeout(t3); t3 = null; }
  }

  function resetPage(n) {
    if (n === 1) art1.classList.remove("show");
    if (n === 2) {
      art2.classList.remove("show");
      cue.classList.remove("done");
    }
    if (n === 3) {
      art3.classList.remove("show");
      bubble.classList.remove("on");
    }
  }

  function showArt(el) { el.classList.add("show"); }

  function revealSnore() {
    cue.classList.add("done");
    showArt(art2);
  }

  function revealBubble() {
    if (!art3.classList.contains("show")) showArt(art3);
    bubble.classList.add("on");
  }

  function go(n) {
    if (n < 1 || n > total || n === page) {
      // still allow first entry
    }
    clearTimers();
    resetPage(1); resetPage(2); resetPage(3);
    page = n;
    for (var i = 0; i < pages.length; i++) {
      pages[i].classList.toggle("on", Number(pages[i].getAttribute("data-page")) === page);
    }
    pager.textContent = "第 " + page + " 页 / 共 " + total + " 页";
    prev.disabled = page === 1;
    next.disabled = page === total;
    if (page === 1) t1 = setTimeout(function () { showArt(art1); }, 700);
    if (page === 2) t2 = setTimeout(revealSnore, 1600);
    if (page === 3) t3 = setTimeout(function () { showArt(art3); }, 800);
  }

  cue.addEventListener("click", function (e) {
    e.stopPropagation();
    if (t2) { clearTimeout(t2); t2 = null; }
    revealSnore();
  });
  ask.addEventListener("click", revealBubble);
  hit.addEventListener("click", revealBubble);

  prev.addEventListener("click", function () { if (page > 1) go(page - 1); });
  next.addEventListener("click", function () { if (page < total) go(page + 1); });

  var x0 = 0, y0 = 0, tracking = false;
  var stage = document.getElementById("stage");
  stage.addEventListener("touchstart", function (e) {
    if (e.changedTouches.length !== 1) return;
    tracking = true;
    x0 = e.changedTouches[0].clientX;
    y0 = e.changedTouches[0].clientY;
  }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - x0;
    var dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.25) {
      if (dx < 0 && page < total) go(page + 1);
      else if (dx > 0 && page > 1) go(page - 1);
    }
  }, { passive: true });

  go(1);
})();
</script>
</body>
</html>
